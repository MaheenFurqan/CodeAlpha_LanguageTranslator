<!DOCTYPE html>
<html>
<head>
    <title>Language Translator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Language Translator</h1>

        <textarea id="textInput" rows="5"
            placeholder="Enter text to translate"></textarea>


        <div class="language-selection">

            <div>
                <label for="sourceLanguage">Source Language:</label>

                <select id="sourceLanguage">
                    <option value="en">English</option>
                    <option value="ur">Urdu</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>


            <div>
                <label for="targetLanguage">Target Language:</label>

                <select id="targetLanguage">
                    <option value="ur">Urdu</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>

        </div>


        <button id="translateButton">Translate</button>

        <p id="error"></p>


        <h2>Translation:</h2>

        <p id="translation"></p>

        <button id="copyButton">Copy Translation</button>

    </div>


    <script>

        // Translation button

        document.getElementById("translateButton").addEventListener("click", async function() {

            const text = document.getElementById("textInput").value;

            const sourceLanguage =
                document.getElementById("sourceLanguage").value;

            const targetLanguage =
                document.getElementById("targetLanguage").value;

            const button =
                document.getElementById("translateButton");

            const error =
                document.getElementById("error");


            // Clear previous error

            error.textContent = "";


            // Check for empty input

            if (text.trim() === "") {

                error.textContent =
                    "Please enter some text to translate.";

                return;
            }


            // Show loading state

            button.textContent = "Translating...";
            button.disabled = true;


            try {

                const response = await fetch("/translate", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        text: text,
                        source: sourceLanguage,
                        target: targetLanguage
                    })

                });


                // Check if Flask returned an error

                if (!response.ok) {
                    throw new Error("Translation request failed.");
                }


                // Convert response to JSON

                const data = await response.json();


                // Display translation

                document.getElementById("translation").textContent =
                    data.translation;


            } catch (error) {

                document.getElementById("error").textContent =
                    "Something went wrong. Please try again.";

            } finally {

                // Return button to normal

                button.textContent = "Translate";
                button.disabled = false;

            }

        });


        // Copy button

        document.getElementById("copyButton").addEventListener("click", async function() {

            const translation =
                document.getElementById("translation").textContent;


            if (translation.trim() === "") {

                alert("There is no translation to copy.");

                return;
            }


            await navigator.clipboard.writeText(translation);

            alert("Translation copied!");

        });

    </script>

</body>
</html>
